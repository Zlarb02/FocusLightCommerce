<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alto Lille — Luminaires design, imprimés en 3D et fabriqués à Lille</title>
    <meta
      name="description"
      content="Alto Lille conçoit des luminaires alliant design contemporain, fabrication locale et matériaux responsables : chêne massif de réemploi et bioplastique PLA imprimé en 3D, dans l'atelier lillois d'Anatole Collet."
    />
    <meta property="og:title" content="Alto Lille — Produire moins, fabriquer mieux" />
    <meta
      property="og:description"
      content="Luminaires design en chêne de réemploi et impression 3D, fabriqués à Lille."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.alto-lille.fr" />
    <meta property="og:image" content="https://www.alto-lille.fr/images/alto/hero.jpg" />
    <link rel="icon" type="image/png" href="/images/alto/favicon.png" />
    <link rel="apple-touch-icon" href="/images/alto/apple-touch-icon.png" />
    <meta name="theme-color" content="#4A2020" />
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash
      try {
        var m = location.search.match(/[?&]theme=(dark|light)/);
        var t = m ? m[1] : localStorage.getItem("theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
